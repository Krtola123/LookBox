# Windows build (ARCHITECTURE §15, M12): tests with real Qt, then RRIPP.exe, then the
# exe checks itself (--selftest) on a machine that never ran the app. The zip is attached
# to the run. A new lookbox.__version__ on main is published as a GitHub release
# (tag v<version>), so releasing = bumping the version.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # only used by the release step on tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt "pyinstaller>=6.6"

      # Failures are also posted as an annotation (readable from the API without logs).
      # Real windows (not Qt's offscreen platform, which has no fonts on Windows).
      - name: Tests (real Qt)
        shell: pwsh
        run: |
          python -m pytest -q -rf --tb=short -p no:cacheprovider 2>&1 | Tee-Object -FilePath pytest.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $t = (Get-Content pytest.txt -Tail 120) -join '%0A'
            Write-Host "::error title=pytest::$t"
          }
          exit $code

      - name: Build RRIPP.exe
        run: |
          python packaging/make_version_info.py
          python -m PyInstaller packaging/lookbox.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the exe
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath dist\RRIPP\RRIPP.exe -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          $text = if (Test-Path $report) { Get-Content $report } else { @("no report written") }
          $log = "$env:LOCALAPPDATA\RRIPP\logs\rripp.log"
          if (Test-Path $log) { $text += "---- rripp.log"; $text += Get-Content $log -Tail 60 }
          $text
          $level = if ($p.ExitCode -eq 0) { "notice" } else { "error" }
          Write-Host ("::$level title=selftest::" + ($text -join '%0A'))
          "{0:N0} MB" -f ((Get-ChildItem dist\RRIPP -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          exit $p.ExitCode

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\RRIPP -DestinationPath RRIPP-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RRIPP-windows
          path: RRIPP-windows.zip
          retention-days: 30

      - name: Release a new version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import lookbox; print(lookbox.__version__)"
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$v is already released"; exit 0 }
          gh release create "v$v" RRIPP-windows.zip --target $env:GITHUB_SHA --title "RRIPP $v" `
            --notes "Unzip anywhere and run RRIPP.exe (keep it next to its _internal folder). Self-tested on Windows by the build."
